name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # macOS and Windows runners have no Linux containers, so testcontainers can't run there.
      - if: runner.os != 'Linux'
        id: pg
        uses: ikalnytskyi/action-setup-postgres@v8
        with:
          postgres-version: "17"
      - name: vet
        run: go vet ./...
      - name: test
        shell: bash
        env:
          DBSCOPE_TEST_DSN: ${{ steps.pg.outputs.connection-uri }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then go test -race -count=1 ./...; else go test -count=1 ./...; fi
      - name: cross-compile without cgo
        if: runner.os == 'Linux'
        run: |
          for os in windows darwin linux; do for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -o /dev/null ./cmd/dbscope
          done; done
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome check .
      - run: pnpm tsc --noEmit
      - run: pnpm vitest run
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm playwright test
