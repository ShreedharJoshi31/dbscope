name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    # The same image the chromium-linux screenshot baselines were generated in;
    # fonts and rendering on a bare runner differ.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome check .
      - run: pnpm typecheck
      - run: pnpm vitest run
      - run: pnpm build
      # Browsers come with the image; the perf project is timing-sensitive and runs locally only.
      - run: pnpm playwright test --project chromium --workers=2
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  # The README's own build command, on each OS, as a user would run it.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: make build
        if: runner.os != 'Windows'
        shell: bash
        run: make build
      # The README's Windows commands, verbatim (make is not assumed there).
      - name: build without make
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npx -y pnpm@12.15.0 --dir web install --frozen-lockfile
          npx -y pnpm@12.15.0 --dir web build
          go build -o bin/dbscope.exe ./cmd/dbscope
      - name: binary runs and serves the embedded UI
        shell: bash
        run: |
          B=./bin/dbscope; [ -f ./bin/dbscope.exe ] && B=./bin/dbscope.exe
          $B version
          DBSCOPE_SECRETS=file $B ui --no-open --port 4599 > out.log 2>&1 &
          for i in $(seq 1 30); do grep -q "running at" out.log && break; sleep 1; done
          curl -fsS http://127.0.0.1:4599/ | grep -q '<div id="root">'
